openapi: 3.0.3
info:
  title: vrp-route-service
  version: 0.1.0
  description: |
    Solves the Capacitated Vehicle Routing Problem (CVRP): one depot, identical vehicles of
    capacity Q, customers with integer demands. Every customer is visited exactly once and no
    route carries more than Q.

    Errors are returned as RFC 9457 problem documents (`application/problem+json`).
    Validation errors (422) list every offending field at once.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: solve
  - name: jobs
  - name: instances
  - name: meta
paths:
  /api/health:
    get:
      tags: [meta]
      summary: Liveness and job counters
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/instances:
    get:
      tags: [instances]
      summary: List bundled benchmark instances
      responses:
        '200':
          description: Instance summaries
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceSummary' }
  /api/instances/{name}:
    get:
      tags: [instances]
      summary: Get a bundled instance in full
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, example: U-n30-k4 }
      responses:
        '200':
          description: The instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/instances/generate:
    post:
      tags: [instances]
      summary: Generate a seeded random instance
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '200':
          description: The generated instance (not stored)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Instance' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/solve:
    post:
      tags: [solve]
      summary: Solve synchronously
      description: Blocks until the solver finishes (at most `timeLimitMs` plus set-up time for `annealing`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveRequest' }
            examples:
              inline:
                value:
                  instance:
                    name: tiny
                    capacity: 10
                    depot: { x: 0, y: 0 }
                    customers:
                      - { id: 1, x: 3, y: 4, demand: 4 }
                      - { id: 2, x: -3, y: 4, demand: 5 }
                      - { id: 3, x: 0, y: -5, demand: 6 }
                  options: { algorithm: exact }
              bundled:
                value:
                  instanceName: C-n50-k5
                  options: { algorithm: annealing, timeLimitMs: 1000, seed: 7 }
      responses:
        '200':
          description: Solution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolveResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
  /api/jobs:
    post:
      tags: [jobs]
      summary: Submit an asynchronous solve job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolveRequest' }
      responses:
        '202':
          description: Job accepted
          headers:
            Location:
              description: URL of the job resource
              schema: { type: string, example: /api/jobs/3f0c8a2e-5d7b-4b0e-9a51-0c1f2e3d4a5b }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
    get:
      tags: [jobs]
      summary: List recent jobs (newest first, without results)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/jobs/{id}:
    get:
      tags: [jobs]
      summary: Job status; includes `result` once SUCCEEDED
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: The request is well-formed JSON but invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Validation Failed
            status: 422
            detail: 2 validation errors
            errors:
              - { field: instance.capacity, message: is required }
              - { field: instance.customers[0].demand, message: demand 12 exceeds vehicle capacity 10 }
  schemas:
    Point:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x: { type: number }
        y: { type: number }
    Customer:
      type: object
      required: [x, y, demand]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 0, description: 'Unique within the instance; defaults to 1-based position' }
        x: { type: number }
        y: { type: number }
        demand: { type: integer, minimum: 0, description: 'Must not exceed capacity' }
    Instance:
      type: object
      required: [capacity, depot, customers]
      additionalProperties: false
      properties:
        name: { type: string, default: custom }
        capacity: { type: integer, minimum: 1 }
        distance:
          type: string
          enum: [euclidean, euclidean-rounded]
          default: euclidean
          description: '`euclidean-rounded` is the TSPLIB EUC_2D convention (nearest integer)'
        depot: { $ref: '#/components/schemas/Point' }
        customers:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/Customer' }
    InstanceSummary:
      type: object
      properties:
        name: { type: string }
        customers: { type: integer }
        capacity: { type: integer }
        totalDemand: { type: integer }
        minVehicles: { type: integer, description: 'ceil(totalDemand / capacity)' }
    SolveOptions:
      type: object
      additionalProperties: false
      properties:
        algorithm:
          type: string
          enum: [savings, local-search, annealing, exact]
          default: annealing
          description: '`exact` is limited to 12 customers'
        timeLimitMs: { type: integer, minimum: 1, maximum: 60000, default: 2000 }
        maxIterations: { type: integer, minimum: 0, description: 'Iteration cap for annealing; with a seed gives reproducible runs' }
        seed: { type: integer, default: 42 }
    SolveRequest:
      type: object
      description: Exactly one of `instance`, `instanceName`, `tsplib`.
      additionalProperties: false
      properties:
        instance: { $ref: '#/components/schemas/Instance' }
        instanceName: { type: string, description: 'Name of a bundled instance' }
        tsplib: { type: string, description: 'Contents of a CVRPLIB/TSPLIB .vrp file' }
        options: { $ref: '#/components/schemas/SolveOptions' }
    RouteResult:
      type: object
      properties:
        customers: { type: array, items: { type: integer }, description: 'Customer ids in visiting order; depot implicit at both ends' }
        load: { type: integer }
        cost: { type: number }
    SolveResult:
      type: object
      properties:
        instance: { type: string }
        algorithm: { type: string }
        cost: { type: number }
        vehicles: { type: integer }
        lowerBound: { type: number, description: 'Valid lower bound on the optimum (MST + K cheapest depot edges)' }
        gapToLowerBound: { type: number, description: '(cost - lowerBound) / cost' }
        initialCost: { type: number, description: 'Clarke-Wright cost before improvement' }
        optimal: { type: boolean, description: 'True only when proven by the exact solver' }
        runtimeMs: { type: integer }
        iterations: { type: integer }
        routes: { type: array, items: { $ref: '#/components/schemas/RouteResult' } }
    Job:
      type: object
      required: [id, status, instance, algorithm, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        instance: { type: string }
        algorithm: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        cost: { type: number }
        error: { type: string }
        result: { $ref: '#/components/schemas/SolveResult' }
    GenerateRequest:
      type: object
      properties:
        customers: { type: integer, minimum: 1, maximum: 500, default: 30 }
        routeSize: { type: integer, minimum: 1, maximum: 500, default: 8, description: 'Target customers per vehicle' }
        layout: { type: string, enum: [uniform, clustered], default: uniform }
        seed: { type: integer, default: 1 }
    Health:
      type: object
      properties:
        status: { type: string, example: UP }
        instances: { type: integer }
        jobs:
          type: object
          properties:
            queued: { type: integer }
            running: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
